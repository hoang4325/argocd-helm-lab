apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/hoang4325/bookinfo.git
    targetRevision: main
    path: apps/sealed-secrets-demo

  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets-demo

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
