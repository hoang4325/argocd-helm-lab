apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookinfo-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hoang4325/argocd-helm-lab.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false 
      selfHeal: true