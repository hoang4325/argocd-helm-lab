apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-secret-consumer
  namespace: sealed-secrets-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-secret-consumer
  template:
    metadata:
      labels:
        app: demo-secret-consumer
    spec:
      containers:
        - name: consumer
          image: busybox:1.36
          command:
            - sh
            - -c
            - while true; do sleep 3600; done
          envFrom:
            - secretRef:
                name: demo-app-secret
