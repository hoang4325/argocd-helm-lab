apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookinfo-details
  namespace: argocd
spec:
  project: bookinfo
  source:
    repoURL: https://github.com/hoang4325/bookinfo.git
    targetRevision: main
    path: details
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

