apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/hoang4325/argocd-helm-lab.git
    targetRevision: main
    path: charts/helm-demo
    helm:
      releaseName: helm-demo

  destination:
    server: https://kubernetes.default.svc
    namespace: helm-demo

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
